<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Scraper</title>
    <style>
        :root {
            --red: #E60023;
            --red-hover: #AD081B;
            --ink: #111111;
            --gray-1: #767676;
            --gray-2: #E9E9E9;
            --bg: #FFFFFF;
            --surface: #EFEFEF;
            --radius: 16px;
            --shadow: 0 1px 20px rgba(0,0,0,.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }

        body[data-theme="dark"] {
            --bg: #1a1a1a;
            --ink: #f5f5f5;
            --surface: #2a2a2a;
            --gray-2: #404040;
        }

        .hidden {
            display: none !important;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--gray-2);
            transition: padding 0.3s;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo svg {
            width: 26px;
            height: 26px;
        }

        .logo-name {
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--red);
        }

        .search-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border-radius: 999px;
            padding: 10px 18px;
            transition: box-shadow .2s, background .2s;
        }

        .search-wrap:focus-within {
            box-shadow: 0 0 0 4px rgba(230,0,35,.15);
            background: var(--bg);
        }

        .search-ico {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
        }

        #search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font: 500 1rem -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--ink);
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            cursor: pointer;
            font: 600 .9rem -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: grid;
            place-items: center;
            transition: transform .15s, background .15s;
        }

        .icon-btn:hover {
            background: var(--gray-2);
            transform: scale(1.06);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px 16px 60px;
        }

        .mode-row {
            display: flex;
            gap: 8px;
            margin: 8px 0 16px;
        }

        .chip {
            border: none;
            cursor: pointer;
            padding: 8px 18px;
            border-radius: 999px;
            font: 600 .9rem -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--surface);
            color: var(--ink);
            transition: background .15s, color .15s;
            display: inline-flex;
            align-items: center;
        }

        .chip:hover {
            background: var(--gray-2);
        }

        .chip.active {
            background: var(--ink);
            color: #fff;
        }

        .chip-badge {
            background: var(--gray-2);
            color: var(--ink);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 800;
            margin-left: 6px;
        }

        .chip.active .chip-badge {
            background: var(--red);
            color: #fff;
        }

        .progress-card {
            background: var(--bg);
            border: 1px solid var(--gray-2);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .progress-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .progress-pct {
            font-weight: 700;
            color: var(--red);
        }

        .phase-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .phase-chip {
            padding: 4px 12px;
            background: var(--surface);
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .phase-chip.active {
            background: var(--red);
            color: #fff;
        }

        .bar {
            width: 100%;
            height: 8px;
            background: var(--surface);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--red), var(--red-hover));
            transition: width 0.3s;
            width: 0%;
        }

        .progress-meta {
            font-size: 0.85rem;
            color: var(--gray-1);
        }

        .stats-card {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: var(--bg);
            border: 1px solid var(--gray-2);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--red);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--gray-1);
            font-weight: 600;
        }

        .export-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font: 600 0.9rem -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform .15s, opacity .15s;
        }

        .btn.primary {
            background: var(--red);
            color: #fff;
        }

        .btn.primary:hover {
            background: var(--red-hover);
        }

        .btn.ghost {
            background: var(--surface);
            color: var(--ink);
        }

        .btn.ghost:hover {
            background: var(--gray-2);
        }

        .masonry {
            columns: 5 200px;
            column-gap: 16px;
            margin-bottom: 40px;
        }

        @media (max-width: 1200px) {
            .masonry {
                columns: 4 180px;
            }
        }

        @media (max-width: 768px) {
            .masonry {
                columns: 2 140px;
            }

            .topbar {
                flex-wrap: wrap;
            }

            .search-wrap {
                order: 3;
                flex-basis: 100%;
            }

            .container {
                padding: 12px;
            }
        }

        .pin-item {
            break-inside: avoid;
            margin-bottom: 16px;
            background: var(--bg);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
            border: 1px solid var(--gray-2);
        }

        .pin-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        .pin-image {
            width: 100%;
            height: auto;
            display: block;
            background: var(--surface);
        }

        .pin-info {
            padding: 12px;
        }

        .pin-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pin-type {
            display: inline-block;
            background: var(--red);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-text {
            color: var(--gray-1);
            max-width: 400px;
            margin: 0 auto;
        }

        .error-card {
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            border: 1px solid #ef5350;
        }

        body[data-theme="dark"] .error-card {
            background: #b71c1c;
            color: #ff9100;
            border-color: #c62828;
        }

        .form-section {
            background: var(--bg);
            border: 1px solid var(--gray-2);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-2);
            border-radius: 8px;
            font: 0.9rem -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            transition: border-color .2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(230,0,35,.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-group input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--red);
        }

        .checkbox-group label {
            cursor: pointer;
            margin: 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .help-text {
            font-size: 0.8rem;
            color: var(--gray-1);
            margin-top: 4px;
        }
    </style>
</head>
<body data-theme="light">
    <header class="topbar">
        <a class="logo" href="/">
            <svg viewBox="0 0 24 24" fill="#E60023">
                <circle cx="12" cy="12" r="12"/>
                <path d="M12.2 5.5c-3.6 0-5.5 2.4-5.5 5 0 1.2.7 2.7 1.7 3.2.2.1.3 0 .3-.1l.3-1.2c0-.1 0-.2-.1-.3-.4-.5-.7-1.3-.7-2 0-2 1.5-3.9 4-3.9 2.2 0 3.7 1.5 3.7 3.6 0 2.4-1.2 4-2.8 4-.9 0-1.5-.7-1.3-1.6l.5-2c.2-.7.1-1.3-.6-1.3s-1.2.7-1.2 1.7c0 .6.2 1 .2 1l-.9 3.6c-.3 1.1 0 2.6.1 2.7 0 .1.1.1.2 0 .1-.1 1.2-1.5 1.5-2.5l.6-2.2c.3.6 1.2 1.1 2.1 1.1 2.8 0 4.7-2.5 4.7-5.9C18.9 7.6 16.1 5.5 12.2 5.5z" fill="white"/>
            </svg>
            <span class="logo-name">Scraper</span>
        </a>

        <form class="search-wrap" id="search-form">
            <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="#767676" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input id="search-input" type="text" placeholder="Search Pinterest..." autocomplete="off">
        </form>

        <div class="top-actions">
            <button class="icon-btn" id="layout-btn" title="Toggle layout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                </svg>
            </button>
            <button class="icon-btn" id="theme-btn" title="Toggle theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                </svg>
            </button>
            <button class="icon-btn" id="settings-btn" title="Settings">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.4 13c.04-.32.06-.65.06-1s-.02-.68-.06-1l2.1-1.65a.5.5 0 00.12-.64l-2-3.46a.5.5 0 00-.6-.22l-2.5 1a7.7 7.7 0 00-1.7-1L14.5 2.4A.5.5 0 0014 2h-4a.5.5 0 00-.5.4l-.37 2.65c-.62.26-1.17.6-1.7 1l-2.5-1a.5.5 0 00-.6.22l-2 3.46a.5.5 0 00.12.64L4.55 11c-.04.32-.06.65-.06 1s.02.68.06 1l-2.1 1.65a.5.5 0 00-.12.64l2 3.46c.13.22.39.31.6.22l2.5-1c.53.4 1.08.74 1.7 1l.37 2.65c.04.24.25.4.5.4h4c.25 0 .46-.16.5-.4l.37-2.65c.62-.26 1.17-.6 1.7-1l2.5 1c.21.09.47 0 .6-.22l2-3.46a.5.5 0 00-.12-.64L19.4 13zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="container">
        <div class="mode-row" role="tablist">
            <button class="chip active" id="tab-search" data-view="search">
                <span style="margin-right: 4px;">🔍</span>
                Search
            </button>
            <button class="chip" id="tab-gallery" data-view="gallery">
                <span style="margin-right: 4px;">🖼️</span>
                Results <span class="chip-badge" id="result-count">0</span>
            </button>
        </div>

        <div id="error-container"></div>

        <div id="search-view">
            <div class="grid-2">
                <div>
                    <div class="form-section">
                        <h2 style="margin-bottom: 16px; font-size: 1.1rem;">Search Settings</h2>

                        <div class="form-group">
                            <label for="query">Query</label>
                            <textarea id="query" rows="3" placeholder="Search term or board URL"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="mode">Mode</label>
                            <select id="mode">
                                <option value="search">Search</option>
                                <option value="board">Board</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="limit">Limit</label>
                            <input type="number" id="limit" min="1" max="500" value="25">
                        </div>

                        <h2 style="margin: 20px 0 16px 0; font-size: 1rem; font-weight: 600;">Advanced</h2>

                        <div class="grid-2" style="grid-template-columns: 1fr 1fr;">
                            <div class="form-group">
                                <label for="workers">Workers</label>
                                <input type="number" id="workers" min="1" max="16" value="4">
                                <div class="help-text">Download threads</div>
                            </div>
                            <div class="form-group">
                                <label for="delay">Delay (sec)</label>
                                <input type="number" id="delay" min="0" max="30" step="0.5" value="1">
                            </div>
                            <div class="form-group">
                                <label for="min_width">Min Width</label>
                                <input type="number" id="min_width" min="0" value="0">
                            </div>
                            <div class="form-group">
                                <label for="min_height">Min Height</label>
                                <input type="number" id="min_height" min="0" value="0">
                            </div>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="download" checked>
                            <label for="download">Download Images</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="details" checked>
                            <label for="details">Fetch Details</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="dedup">
                            <label for="dedup">Deduplication</label>
                        </div>

                        <div style="display: flex; gap: 12px; margin-top: 24px;">
                            <button class="btn primary" id="start-btn" style="flex: 1;">Start Scraping</button>
                            <button class="btn ghost" id="cancel-btn" style="flex: 1; display: none;">Cancel</button>
                        </div>
                    </div>
                </div>

                <div>
                    <div id="progress-container" style="display: none;">
                        <div class="progress-card">
                            <div class="progress-head">
                                <span id="progress-title">Initializing...</span>
                                <span class="progress-pct" id="progress-pct">0%</span>
                            </div>
                            <div id="phase-container" class="phase-chips">
                                <span class="phase-chip" data-phase="collect">Collect</span>
                                <span class="phase-chip" data-phase="details">Details</span>
                                <span class="phase-chip" data-phase="download">Download</span>
                            </div>
                            <div class="bar">
                                <div class="bar-fill" id="progress-bar"></div>
                            </div>
                            <div class="progress-meta" id="progress-meta">Loading...</div>
                        </div>
                    </div>

                    <div id="stats-container" style="display: none;">
                        <div class="stats-card">
                            <div class="stat-item">
                                <div class="stat-value" id="total-stat">0</div>
                                <div class="stat-label">Total Found</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="download-stat">0</div>
                                <div class="stat-label">Downloaded</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="image-stat">0</div>
                                <div class="stat-label">Images</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="video-stat">0</div>
                                <div class="stat-label">Videos</div>
                            </div>
                        </div>

                        <div class="export-bar">
                            <button class="btn primary" id="download-zip">Download ZIP</button>
                            <button class="btn ghost" id="download-xlsx">Download XLSX</button>
                        </div>
                    </div>

                    <div id="empty-state" class="empty-state">
                        <div class="empty-icon">🎨</div>
                        <h3 class="empty-title">Ready to Search</h3>
                        <p class="empty-text">Enter a search query and click "Start Scraping" to begin collecting pins.</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="gallery-view" style="display: none;">
            <div id="results-container" class="masonry"></div>
        </div>
    </main>

    <script>
        const API_BASE = window.location.origin;
        let currentJobId = null;
        let allResults = [];

        const elements = {
            query: document.getElementById('query'),
            mode: document.getElementById('mode'),
            limit: document.getElementById('limit'),
            workers: document.getElementById('workers'),
            delay: document.getElementById('delay'),
            min_width: document.getElementById('min_width'),
            min_height: document.getElementById('min_height'),
            download: document.getElementById('download'),
            details: document.getElementById('details'),
            dedup: document.getElementById('dedup'),
            startBtn: document.getElementById('start-btn'),
            cancelBtn: document.getElementById('cancel-btn'),
            progressContainer: document.getElementById('progress-container'),
            progressTitle: document.getElementById('progress-title'),
            progressPct: document.getElementById('progress-pct'),
            progressBar: document.getElementById('progress-bar'),
            progressMeta: document.getElementById('progress-meta'),
            statsContainer: document.getElementById('stats-container'),
            emptyState: document.getElementById('empty-state'),
            tabSearch: document.getElementById('tab-search'),
            tabGallery: document.getElementById('tab-gallery'),
            searchView: document.getElementById('search-view'),
            galleryView: document.getElementById('gallery-view'),
            resultsContainer: document.getElementById('results-container'),
            errorContainer: document.getElementById('error-container'),
            themeBtn: document.getElementById('theme-btn'),
            resultCount: document.getElementById('result-count'),
        };

        elements.themeBtn.addEventListener('click', () => {
            const current = document.body.getAttribute('data-theme');
            const newTheme = current === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }

        elements.tabSearch.addEventListener('click', () => {
            elements.tabSearch.classList.add('active');
            elements.tabGallery.classList.remove('active');
            elements.searchView.style.display = 'block';
            elements.galleryView.style.display = 'none';
        });

        elements.tabGallery.addEventListener('click', () => {
            elements.tabGallery.classList.add('active');
            elements.tabSearch.classList.remove('active');
            elements.searchView.style.display = 'none';
            elements.galleryView.style.display = 'block';
        });

        function showError(message) {
            elements.errorContainer.innerHTML = `<div class="error-card">${message}</div>`;
        }

        function clearError() {
            elements.errorContainer.innerHTML = '';
        }

        function updateProgress(title, percent, details) {
            elements.progressTitle.textContent = title;
            elements.progressPct.textContent = `${percent}%`;
            elements.progressBar.style.width = `${percent}%`;
            if (details) elements.progressMeta.textContent = details;
        }

        function displayResults(results) {
            allResults = results;
            elements.resultsContainer.innerHTML = '';

            if (!results || results.length === 0) {
                elements.resultsContainer.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-icon">😢</div><h3>No Results</h3><p>Try different search terms</p></div>';
                return;
            }

            results.forEach(item => {
                const card = document.createElement('div');
                card.className = 'pin-item';
                card.innerHTML = `
                    <img src="${item.image_url || item.thumb || ''}" alt="${item.title || 'Pin'}" class="pin-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'">
                    <div class="pin-info">
                        <div class="pin-title" title="${item.title || 'Untitled'}">${item.title || 'Untitled'}</div>
                        <span class="pin-type">${item.type === 'video' ? 'Video' : 'Image'}</span>
                    </div>
                `;
                elements.resultsContainer.appendChild(card);
            });
        }

        async function startScraping() {
            const query = elements.query.value.trim();
            if (!query) {
                showError('Please enter a search query');
                return;
            }

            clearError();
            elements.startBtn.style.display = 'none';
            elements.cancelBtn.style.display = 'block';
            elements.cancelBtn.textContent = 'Cancel';
            elements.emptyState.style.display = 'none';
            elements.progressContainer.style.display = 'block';
            elements.statsContainer.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/api/scrape`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        mode: elements.mode.value,
                        limit: parseInt(elements.limit.value),
                        download: elements.download.checked,
                        details: elements.details.checked,
                        dedup: elements.dedup.checked,
                        workers: parseInt(elements.workers.value),
                        delay: parseFloat(elements.delay.value),
                        jitter: 0.5,
                        batch_size: 10,
                        min_width: parseInt(elements.min_width.value),
                        min_height: parseInt(elements.min_height.value),
                        proxy: ''
                    })
                });

                const data = await response.json();
                currentJobId = data.job_id;
                monitorProgress();
            } catch (error) {
                showError(`Error: ${error.message}`);
                elements.startBtn.style.display = 'block';
                elements.cancelBtn.style.display = 'none';
                elements.progressContainer.style.display = 'none';
            }
        }

        async function monitorProgress() {
            if (!currentJobId) return;

            try {
                const response = await fetch(`${API_BASE}/api/jobs/${currentJobId}/events`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines[lines.length - 1];

                    for (let i = 0; i < lines.length - 1; i++) {
                        const line = lines[i];
                        if (line.startsWith('data: ')) {
                            try {
                                const event = JSON.parse(line.slice(6));
                                if (event.phase) {
                                    updateProgress(`${event.phase}...`, event.progress || 0, `Found: ${event.total || 0}`);
                                }
                            } catch (e) {}
                        }
                    }
                }

                const resultResponse = await fetch(`${API_BASE}/api/jobs/${currentJobId}/result`);
                const resultData = await resultResponse.json();
                displayFinalResults(resultData);
            } catch (error) {
                showError(`Error: ${error.message}`);
            } finally {
                elements.startBtn.style.display = 'block';
                elements.cancelBtn.style.display = 'none';
                currentJobId = null;
            }
        }

        function displayFinalResults(data) {
            if (data.status === 'error') {
                showError(`Scraping failed: ${data.error}`);
                return;
            }

            elements.progressContainer.style.display = 'none';
            elements.statsContainer.style.display = 'block';

            const stats = data.stats || {};
            document.getElementById('total-stat').textContent = data.pins ? data.pins.length : 0;
            document.getElementById('download-stat').textContent = stats.downloaded || 0;
            document.getElementById('image-stat').textContent = (data.pins || []).filter(p => p.type !== 'video').length;
            document.getElementById('video-stat').textContent = (data.pins || []).filter(p => p.type === 'video').length;

            elements.resultCount.textContent = data.pins ? data.pins.length : 0;
            displayResults(data.pins || []);
            clearError();
        }

        elements.startBtn.addEventListener('click', startScraping);

        elements.cancelBtn.addEventListener('click', async () => {
            if (currentJobId) {
                await fetch(`${API_BASE}/api/jobs/${currentJobId}/cancel`, { method: 'POST' }).catch(() => {});
                showError('Scraping cancelled');
                elements.startBtn.style.display = 'block';
                elements.cancelBtn.style.display = 'none';
                elements.progressContainer.style.display = 'none';
                currentJobId = null;
            }
        });

        document.getElementById('download-zip').addEventListener('click', () => {
            if (currentJobId) {
                window.location.href = `${API_BASE}/api/jobs/${currentJobId}/download/zip`;
            }
        });

        document.getElementById('download-xlsx').addEventListener('click', () => {
            if (currentJobId) {
                window.location.href = `${API_BASE}/api/jobs/${currentJobId}/download/xlsx`;
            }
        });
    </script>
</body>
</html>
