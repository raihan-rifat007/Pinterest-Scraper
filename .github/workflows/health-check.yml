name: Health Check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements.txt

      - name: Check API imports
        run: |
          python -c "
          import sys
          modules = [
              'core.scraper', 'core.http', 'core.downloader',
              'core.dedupe', 'core.storage',
              'api.server', 'api.models', 'api.jobs',
              'cli.main'
          ]
          for module in modules:
              try:
                  __import__(module)
                  print(f'✓ {module}')
              except ImportError as e:
                  print(f'✗ {module}: {e}')
                  sys.exit(1)
          "

      - name: Check dependencies
        run: |
          pip check

      - name: Verify Docker builds
        run: |
          docker build -t pinterest-scraper:test . --no-cache

      - name: Health check on test deployment
        if: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.RENDER_SERVICE_URL }}/api/health)
          if [ $response -ne 200 ]; then
            echo "❌ Health check failed (HTTP $response)"
            exit 1
          fi
          echo "✓ Service is healthy (HTTP $response)"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Health check failed!'
            })
